<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrenCut packing workbench</title><style>:root{font:16px system-ui;color-scheme:dark;background:#141923;color:#edf1f8}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:1rem}main{display:grid;grid-template-columns:minmax(250px,350px) 1fr;gap:1rem}section{background:#222a39;border:1px solid #45516a;border-radius:12px;padding:1rem}label{display:block;margin:.6rem 0}input{width:100%;padding:.4rem;background:#101723;color:inherit;border:1px solid #7d8ba6;border-radius:5px}input[type=checkbox]{width:auto}button{padding:.5rem;border:0;border-radius:6px;background:#a9d4f4;color:#112133;cursor:pointer;margin:.25rem}button:focus-visible,input:focus-visible{outline:3px solid #ffce7a}#preview{width:100%;max-height:75vh;background:white}#message{white-space:pre-wrap}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><h1>BrenCut experimental packing</h1><p>Exact dimensions, locked placements and clear failure reports. No printer connection.</p><main><section><h2>Sheet and spacing</h2><label>Sheet width (mm)<input id="sheetWidth" type="number" min="10" max="1000" value="101.6"></label><label>Sheet height (mm)<input id="sheetHeight" type="number" min="10" max="1000" value="177.8"></label><label>Edge clearance (mm)<input id="edge" type="number" min="0" max="50" value="3"></label><label>Spacing (mm)<input id="gap" type="number" min="0" max="50" value="4.5"></label><label><input id="rotate" type="checkbox"> Allow 90° rotation</label><fieldset><legend>Add piece</legend><label>Name<input id="name" maxlength="80" value="Panel"></label><label>Width (mm)<input id="width" type="number" min=".1" max="1000" value="20"></label><label>Height (mm)<input id="height" type="number" min=".1" max="1000" value="30"></label><label><input id="locked" type="checkbox"> Lock position</label><label><input id="allowRotate" type="checkbox" checked> Piece may rotate</label><button id="add">Add piece</button></fieldset><button id="arrange">Arrange</button><button id="clear">Clear</button><button id="export">Export JSON</button><h2>Pieces</h2><ol id="pieces"></ol><p id="message" role="status" aria-live="polite"></p></section><section><h2>Layout preview</h2><svg id="preview" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sheet preview"></svg><p>Preview only. All dimensions are in millimetres.</p></section></main><script type="module" src="./workbench.js"></script></body></html>
